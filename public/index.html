<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI-MASK Web Agent</title>

  <meta
    name="description"
    content="AI-MASK Web Agent"
  />

  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div class="app-shell">

    <header class="app-header">
      <div>
        <h1 id="app-name">AI-MASK Web Agent</h1>

        <p>
          Version <span id="app-version">Loading...</span>
          · Environment <span id="app-environment">Loading...</span>
        </p>
      </div>
    </header>

    <main class="app-main">
      <section class="agent-panel" aria-labelledby="agent-title">

        <div class="agent-placeholder">
          <h2 id="agent-title">Web Agent</h2>

          <p>
            Agent workspace is ready.
          </p>
        </div>

        <div class="agent-output-area">
          <div class="agent-output-header">
            <span>Agent Status</span>
            <span id="agent-status">Ready</span>
          </div>

          <pre
            id="agent-output"
            aria-live="polite"
          >No response yet.</pre>
        </div>

        <div class="agent-input-area">
          <label for="agent-input">
            Agent Input
          </label>

          <textarea
            id="agent-input"
            rows="5"
            placeholder="Enter your request..."
            aria-label="Agent request"
          ></textarea>

          <div class="agent-actions">
            <button
              id="agent-submit"
              type="button"
            >
              Send
            </button>

            <button
              id="agent-clear"
              type="button"
            >
              Clear
            </button>
          </div>

          <p class="agent-input-hint">
            Press Ctrl + Enter to send.
          </p>
        </div>

      </section>
    </main>

    <footer class="app-footer">
      <p>
        System Status:
        <span id="system-status">Loading...</span>
      </p>
    </footer>

  </div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script src="/ui.js"></script>
</body>
</html>
