<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI-MASK Web Agent</title>

  <meta
    name="description"
    content="AI-MASK Web Agent"
  />

  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div class="app-shell">

    <header class="app-header">
      <div class="app-header-main">
        <h1 id="app-name">AI-MASK Web Agent</h1>

        <p class="app-meta">
          Version <span id="app-version">Loading...</span>
          · Environment <span id="app-environment">Loading...</span>
        </p>
      </div>

      <div class="agent-header-status">
        <span class="status-label">Agent</span>
        <span id="agent-status">Ready</span>
      </div>
    </header>

    <main class="app-main">
      <section class="agent-panel">

        <div class="agent-placeholder">
          <h2>Web Agent</h2>
          <p>
            AI-MASK Agent workspace is ready.
          </p>
        </div>

        <div class="agent-input-area">
          <div class="agent-section-header">
            <label for="agent-input">Agent Input</label>
            <span>Request</span>
          </div>

          <textarea
            id="agent-input"
            rows="5"
            placeholder="Enter your request..."
            aria-label="Agent request input"
          ></textarea>

          <div class="agent-controls">
            <button
              id="agent-submit"
              type="button"
            >
              Send
            </button>

            <button
              id="agent-clear"
              type="button"
            >
              Clear
            </button>
          </div>

          <p class="agent-input-hint">
            Press Ctrl + Enter to send.
          </p>
        </div>

        <div class="agent-output-area">
          <div class="agent-section-header">
            <h3>Agent Output</h3>
            <span id="agent-output-type">Response</span>
          </div>

          <div
            id="agent-output"
            role="status"
            aria-live="polite"
          >
            No response yet.
          </div>
        </div>

      </section>
    </main>

    <footer class="app-footer">
      <p>
        System Status:
        <span id="system-status">Loading...</span>
      </p>
    </footer>

  </div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <script src="/ui.js"></script>
</body>
</html>
